name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    name: 포맷 검증 & 린트 & 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 포맷 검증
        run: npx prettier --check .

      - name: 린트 검증
        run: npm run lint

      - name: 빌드
        run: npm run build
